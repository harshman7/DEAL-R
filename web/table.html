<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAL-R Poker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.pokerUI.logout()">←</button>
        <div class="top-title">DEAL-R</div>
        <div class="top-actions">
            <span class="table-name" id="tableName">table-1</span>
        </div>
    </div>

    <!-- Players Row -->
    <div class="players-row" id="playersRow">
        <!-- Players will be dynamically added here -->
    </div>

    <!-- Community Cards Area -->
    <div class="community-area">
        <div class="street-display" id="streetDisplay" style="display: none;"></div>
        <div class="community-cards" id="communityCards">
            <!-- Cards will be inserted here -->
        </div>
        <div class="pot-display" id="potDisplay">
            <span class="pot-label">Pot</span>
            <span class="pot-value" id="potValue">$0</span>
        </div>
    </div>

    <!-- Results Display (after hand completion) -->
    <div class="results-panel" id="resultsPanel" style="display: none;">
        <div class="results-header">Hand Results</div>
        <div class="results-content" id="resultsContent"></div>
        <div class="results-actions">
            <button class="results-btn primary" id="newHandBtn" onclick="window.pokerUI.startHand()">Start New Hand</button>
            <button class="results-btn secondary" id="leaveTableBtn" onclick="window.pokerUI.leaveTable()">Leave Table</button>
        </div>
    </div>

    <!-- Action Button (Center) -->
    <div class="action-center" id="actionCenter" style="display: none;">
        <button class="action-center-btn" id="waitBtn">Wait for the next hand</button>
        <button class="action-center-btn" id="startHandBtn" style="display: none; margin-top: 12px;" onclick="window.pokerUI.startHand()">Start Hand</button>
    </div>

    <!-- Action Panel (Bottom) -->
    <div class="action-panel" id="actionPanel" style="display: none;">
        <div class="action-info" id="actionInfo"></div>
        <div class="action-buttons">
            <button id="foldBtn" class="action-btn fold">Fold</button>
            <button id="checkBtn" class="action-btn check">Check</button>
            <button id="callBtn" class="action-btn call">Call</button>
            <div class="bet-controls">
                <input type="number" id="betAmount" placeholder="Amount" min="0">
                <button id="betBtn" class="action-btn bet">Bet</button>
                <button id="raiseBtn" class="action-btn raise">Raise</button>
            </div>
            <button id="allInBtn" class="action-btn all-in">All-In</button>
        </div>
    </div>

    <!-- Your Cards (Bottom) -->
    <div class="player-cards-area">
        <div class="your-cards" id="yourCards">
            <!-- Cards will be inserted here -->
        </div>
        <div class="player-info-bottom">
            <div class="player-avatar" id="playerAvatar">👤</div>
            <div class="player-stack" id="playerStack">1,000</div>
        </div>
    </div>

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel" style="display: none;">
        <div class="debug-header">
            <strong>Debug</strong>
            <button onclick="document.getElementById('debugPanel').style.display='none'">×</button>
        </div>
        <div id="debugContent"></div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="window.location.href='home.html'">Home</button>
        <button class="nav-btn active" onclick="window.location.href='table.html'">Table</button>
        <button class="nav-btn" onclick="window.location.href='roulette.html'">Roulette</button>
        <button class="nav-btn" onclick="window.pokerUI.logout()">Logout</button>
    </div>

    <script src="session.js"></script>
    <script src="table.js"></script>
</body>
</html>
