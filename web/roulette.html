<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEAL-R - Daily Roulette</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .roulette-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg-primary);
        }

        .roulette-wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 8px solid var(--border);
            background: conic-gradient(
                from 0deg,
                #ff4444 0deg 60deg,
                #4444ff 60deg 120deg,
                #44ff44 120deg 180deg,
                #ff44ff 180deg 240deg,
                #ffff44 240deg 300deg,
                #44ffff 300deg 360deg
            );
            position: relative;
            margin: 40px auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .roulette-wheel.spinning {
            animation: spin 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(2160deg); }
        }

        .roulette-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid var(--accent);
            z-index: 10;
        }

        .roulette-info {
            text-align: center;
            margin: 24px 0;
        }

        .roulette-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .roulette-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .reward-display {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
            margin: 16px 0;
            min-height: 48px;
        }

        .reward-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
        }

        .spin-btn {
            padding: 16px 48px;
            border: 2px solid var(--accent);
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            margin: 24px 0;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .daily-status {
            padding: 12px 24px;
            border-radius: 8px;
            margin: 16px 0;
            font-size: 14px;
        }

        .daily-status.available {
            background: rgba(74, 158, 255, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
        }

        .daily-status.used {
            background: rgba(102, 102, 102, 0.1);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px;
            z-index: 1000;
        }

        .nav-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .nav-btn.active {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
        }

        .nav-btn:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="roulette-container">
        <div class="roulette-info">
            <div class="roulette-title">Daily Roulette</div>
            <div class="roulette-description">Spin once per day for free chips!</div>
        </div>

        <div style="position: relative;">
            <div class="roulette-pointer"></div>
            <div class="roulette-wheel" id="rouletteWheel"></div>
        </div>

        <div class="reward-display" id="rewardDisplay">-</div>
        <div class="reward-label">Reward</div>

        <div class="daily-status" id="dailyStatus">Checking availability...</div>

        <button class="spin-btn" id="spinBtn" onclick="window.rouletteUI.spin()" disabled>Spin</button>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="window.location.href='home.html'">Home</button>
        <button class="nav-btn" onclick="window.location.href='table.html'">Table</button>
        <button class="nav-btn active" onclick="window.location.href='roulette.html'">Roulette</button>
        <button class="nav-btn" onclick="window.rouletteUI.logout()">Logout</button>
    </div>

    <script src="roulette.js"></script>
</body>
</html>
